<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <div class="profile-header">
      <div class="avatar">DEV</div>
      <h1>John Doe</h1>
      <p class="tagline">Frontend Developer & Open Source Enthusiast</p>
    </div>

    <div class="bio">
      <p>Building clean, responsive, and performance-driven web experiences.</p>
    </div>

    <div class="links">
      <a href="https://github.com" target="_blank" class="link-btn">GitHub Profile</a>
      <a href="https://linkedin.com" target="_blank" class="link-btn">LinkedIn</a>
      <a href="mailto:hello@example.com" class="link-btn">Contact Me</a>
    </div>

    <footer class="card-footer">
      <span>Built for Git Practice</span>
    </footer>
  </main>

</body>
</html>
